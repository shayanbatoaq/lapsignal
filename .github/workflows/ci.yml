name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/api --frozen
      - run: pnpm seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @lapsignal/web exec playwright install chromium
      - run: pnpm test:e2e
        env:
          OPENAI_API_KEY: ""
